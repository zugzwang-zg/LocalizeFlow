name: Release smoke

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-gate:
    name: Full release regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Python project
        run: python -m pip install uv==0.12.4 && uv sync --locked --extra dev
      - name: Python quality and regression
        run: |
          uv run ruff check .
          uv run mypy
          uv run pytest -q
          uv run python prompts/tests/validate_prompts_offline.py
          uv run python app/main.py --smoke-test
          uv run python scripts/run_operations_drill.py
          uv run python scripts/check_open_source_release_candidate.py --expect-draft-ready
          uv run python scripts/check_hosted_trial_prerequisites.py --expect-unresolved
          uv run python scripts/check_free_trial_release_gate.py --expect-no-go
      - name: Install Web project
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Web quality, security, and build
        working-directory: web
        run: |
          pnpm security:audit
          pnpm lint
          pnpm test
          pnpm build
